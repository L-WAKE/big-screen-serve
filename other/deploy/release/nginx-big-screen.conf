# 大屏 GoView - 复制到服务器 /etc/nginx/sites-available/big-screen
# 启用: sudo ln -s /etc/nginx/sites-available/big-screen /etc/nginx/sites-enabled/
# 测试: sudo nginx -t && sudo systemctl reload nginx

# HTTP 端口访问（与 8088、8089 并列）
server {
    listen 8090;
    server_name 82.156.253.71;

    root /var/www/big-screen/dist;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oss/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 域名访问（需先配置 DNS + certbot）
server {
    listen 443 ssl http2;
    server_name screen.liulaoban.online;

    # certbot 会自动写入 ssl 证书路径，首次可先注释本 server 块，只开 8090
    # ssl_certificate     /etc/letsencrypt/live/screen.liulaoban.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/screen.liulaoban.online/privkey.pem;

    root /var/www/big-screen/dist;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oss/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name screen.liulaoban.online;
    return 301 https://$host$request_uri;
}
